name: Build macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop.py'
      - 'desktop_macos.spec'
      - 'automation/**'
      - 'web/**'
      - 'requirements*.txt'
      - '.github/workflows/build-macos.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: apple-silicon
          - runner: macos-15-intel
            architecture: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pywebview[cocoa]' pystray keyring
      - name: Build macOS app bundle
        run: python -m PyInstaller --noconfirm desktop_macos.spec
      - name: Launch app smoke check
        run: >-
          python -c "import subprocess; subprocess.run(['dist/FBAutomationRealEstate.app/Contents/MacOS/FBAutomationRealEstate', '--smoke-test'], timeout=90, check=True)"
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: FBAutomationRealEstate-macOS-${{ matrix.architecture }}
          path: dist/FBAutomationRealEstate.app
          if-no-files-found: error
          retention-days: 14
