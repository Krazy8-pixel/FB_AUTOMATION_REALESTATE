<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tayyara Motors | {% if setup_mode %}Create Login{% else %}Sign In{% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/branding.css') }}">
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#edf5ff,#f8fafc 55%,#e8eef7); color:#0f172a; }
    .login-card { width:min(100%,420px); padding:32px; background:#fff; border:1px solid #dbe4ee; border-radius:0; box-shadow:0 20px 50px rgba(15,23,42,.12); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .brand { justify-content:center; }
    h1 { margin:0 0 20px; font-size:20px; text-align:center; color:#0b3d91; }
    .subtitle { margin:6px 0 24px; color:#64748b; line-height:1.45; }
    label { display:block; margin:14px 0 6px; font-size:14px; font-weight:700; }
    input { width:100%; height:48px; padding:0 13px; border:1px solid #cbd5e1; border-radius:0; font:inherit; outline:none; }
    input:focus { border-color:#1677d2; box-shadow:0 0 0 3px rgba(22,119,210,.13); }
    button { width:100%; height:49px; margin-top:22px; border:0; border-radius:0; background:#1677d2; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:hover { background:#1264b1; }
    .error { padding:11px 12px; margin-bottom:14px; border-radius:0; background:#fee2e2; color:#991b1b; font-size:14px; }
    .setup-note { margin-top:18px; color:#64748b; font-size:13px; line-height:1.45; }
  </style>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='app.ico', v='tayyara-motors-only') }}">
</head>
<body>
  <main class="login-card">
    <div class="brand"><img class="app-brand-logo" src="{{ url_for('static', filename='tayyara-logo.png', v='transparent-2') }}" width="300" height="100" alt="Tayyara Motors Auto Sales"></div>
    <h1>{% if setup_mode %}CREATE LOGIN{% else %}SIGN IN{% endif %}</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('web.portal_setup') if setup_mode else url_for('web.portal_login') }}">
      {% if not setup_mode %}<input type="hidden" name="next" value="{{ next_url or url_for('web.dashboard') }}">{% endif %}
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="{% if setup_mode %}new-password{% else %}current-password{% endif %}" minlength="8" required>
      {% if setup_mode %}
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      {% endif %}
      <button type="submit">{% if setup_mode %}Create Login{% else %}Sign In{% endif %}</button>
    </form>
  </main>
</body>
</html>
